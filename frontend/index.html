    <!-- JSON-LD: FAQ (espeja la sección de preguntas de la landing) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Mis datos están seguros?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí. Cada empresa vive aislada a nivel de base de datos, las sesiones usan cookies que el navegador no puede leer, y hay respaldos automáticos cifrados." }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa cuando termina la prueba?",
          "acceptedAnswer": { "@type": "Answer", "text": "Te avisamos antes. Si no eliges un plan, tu cuenta queda unos días en modo lectura: sigues viendo todo lo tuyo, pero no puedes registrar nuevos movimientos. No borramos nada ni te cobramos sin avisar." }
        },
        {
          "@type": "Question",
          "name": "¿Tengo que instalar algo?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. Nodo funciona en el navegador y se puede instalar como app en el celular con un toque." }
        },
        {
          "@type": "Question",
          "name": "¿Puedo usar solo un módulo?",
          "acceptedAnswer": { "@type": "Answer", "text": "Sí, para eso es modular. Activas únicamente lo que tu negocio necesita hoy y agregas más cuando haga falta." }
        },
        {
          "@type": "Question",
          "name": "¿Y si me quiero ir?",
          "acceptedAnswer": { "@type": "Answer", "text": "Te llevas tus datos. Cancelas cuando quieras desde el panel, sin llamadas ni formularios de retención." }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900;1000&display=swap" rel="stylesheet" />

    <style>
      body { margin: 0; background: #F4F2EE; }
      html.dark, html.dark body { background: #000000; }
      /* El hero estático solo existe para el primer paint y para los rastreadores
         que no ejecutan JS. Fuera de la landing no debe verse ni un frame. */
      html[data-route="app"] #seo-hero { display: none; }
      #seo-hero {
        max-width: 46rem; margin: 0 auto; padding: 9rem 1.5rem 0;
        font-family: Nunito, Inter, system-ui, sans-serif; text-align: center; color: #FFFFFF;
      }
      #seo-hero h1 { font-size: 2.75rem; font-weight: 900; line-height: 1; letter-spacing: -0.02em; margin: 0; }
      #seo-hero p  { margin: 1.5rem 0 0; font-size: 1.05rem; line-height: 1.6; color: rgba(255,255,255,0.62); }
    </style>

    <script>
      // Antes del primer paint: la landing se compromete con el tema oscuro, y
      // /portal no debe indexarse ni mostrar el hero estático de SEO.
      (function () {
        // App instalada (PWA) abierta en `/`: nunca mostrar la landing, que es
        // material de venta para visitantes. El `start_url: /portal` del
        // manifest cubre la instalación estándar, pero iOS anterior a 16.4 lo
        // ignora y abre la URL desde la que se añadió a la pantalla de inicio.
        var standalone =
          window.navigator.standalone === true ||
          (window.matchMedia &&
            ['standalone', 'fullscreen', 'minimal-ui'].some(function (m) {
              return window.matchMedia('(display-mode: ' + m + ')').matches;
            }));
        if (standalone && window.location.pathname === '/') {
          window.location.replace('/portal');
          return;
        }

        var isLanding = window.location.pathname === '/';
        var root = document.documentElement;
        root.dataset.route = isLanding ? 'landing' : 'app';
        if (isLanding) root.classList.add('dark');
        if (/^\/portal\/?$/.test(window.location.pathname)) {
          var m = document.head.querySelector('meta[name="robots"]');
          if (!m) {
            m = document.createElement('meta');
            m.name = 'robots';
            document.head.appendChild(m);
          }
          m.content = 'noindex, nofollow';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="seo-hero">
        <h1>Tu negocio entero, en una sola pantalla.</h1>
        <p>

          modular que reemplaza el cuaderno, la hoja de Excel y los tres grupos de WhatsApp —
          y le da a tus clientes una página propia para comprarte.
        </p>
      </div>
    </div>
