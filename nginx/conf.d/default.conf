limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=register_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tracking_zone:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m      rate=60r/m;

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Login — 10 intentos/min por IP (brute-force protection)
    location = /api/auth/jwt/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registro — 5 intentos/min por IP
    location = /api/auth/register-workspace {
        limit_req zone=register_zone burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tracking público — 15 req/min por IP
    location ~ ^/api/tracking/ {
        limit_req zone=tracking_zone burst=5 nodelay;
        limit_req_status 429;

        add_header Cache-Control "public, max-age=20, s-maxage=20" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto de la API — 60 req/min por IP
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (SSE)
    location /api/stream {
        proxy_pass http://backend:8000/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
