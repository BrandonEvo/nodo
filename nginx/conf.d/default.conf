limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=register_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tracking_zone:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m      rate=60r/m;

server {
    listen 80;
    server_name 35.208.20.242 35.208.20.242.nip.io;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers — aplican a todas las responses
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "DENY"                      always;
    add_header X-XSS-Protection          "1; mode=block"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # HSTS: activar solo después de confirmar que HTTPS funciona correctamente.
    # Una vez activo, los navegadores fuerzan HTTPS por max-age segundos.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Timeouts amplios hacia el backend. En este VM las primeras requests tras
    # inactividad pueden tardar varios segundos (cold start / swap-in); con el
    # default de 60s, login o registro devolvían 504. La location SSE mantiene
    # su propio proxy_read_timeout 24h porque lo define explícitamente.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Login — 10 intentos/min por IP (brute-force protection)
    location = /api/auth/jwt/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registro — 5 intentos/min por IP
    location = /api/auth/register-workspace {
        limit_req zone=register_zone burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tracking público — 15 req/min por IP
    location ~ ^/api/tracking/ {
        limit_req zone=tracking_zone burst=5 nodelay;
        limit_req_status 429;

        add_header Cache-Control "public, max-age=20, s-maxage=20" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto de la API — 60 req/min por IP
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (SSE)
    location /api/stream {
        proxy_pass http://backend:8000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
