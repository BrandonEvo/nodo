# ============================================================
# Restaurar la IP real del cliente (tráfico llega vía Cloudflare).
# Sin esto, $remote_addr es una IP de Cloudflare y el rate-limit por IP
# agruparía a todos los usuarios bajo unas pocas IPs del edge.
# Rangos oficiales: https://www.cloudflare.com/ips/
# ============================================================
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=login_zone:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=register_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tracking_zone:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=store_zone:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=booking_zone:10m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=public_zone:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=shopper_reserve_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m      rate=300r/m;
limit_req_zone $binary_remote_addr zone=og_zone:10m       rate=120r/m;

# Preview de links compartidos. Un catálogo que se pega en 40 grupos genera
# muchos hits desde las IPs de Meta, por eso la zona es holgada.
#
# El upstream con nombre NO es decorativo: un proxy_pass con variable en la URI
# resuelve el host en runtime y nginx aborta con "no resolver defined". Al
# coincidir el host con un upstream declarado, usa ese grupo y no pide resolver.
upstream nodo_backend_og { server backend:8000; }

map $http_user_agent $og_bot {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|meta-externalagent|WhatsApp|Twitterbot|TelegramBot|Discordbot|LinkedInBot|Slackbot|SkypeUriPreview|Applebot|redditbot|Pinterest|Iframely|Embedly|Googlebot|Google-InspectionTool|bingbot|BingPreview|DuckDuckBot)" 1;
}

# ------------------------------------------------------------
# Default server :80 — rechaza accesos que NO usen el dominio
# (ej. http://166.1.88.198 directo al origen, sin pasar por Cloudflare).
# 444 = cerrar la conexión sin responder.
# ------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# HTTP :80 (dominio) — redirige a HTTPS. Cloudflare 'Always Use HTTPS'
# ya lo hace en el edge; esto cubre el tramo CF->origen por http.
server {
    listen 80;
    server_name hellonodo.com www.hellonodo.com;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# Default server :443 — rechaza el handshake TLS si el SNI no es el
# dominio (ej. https://166.1.88.198 directo). No necesita certificado.
# ------------------------------------------------------------
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ------------------------------------------------------------
# HTTPS :443 — Cloudflare (Full Strict) se conecta acá con el
# certificado Origin CA.
# ------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name hellonodo.com www.hellonodo.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers — aplican a todas las responses
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "DENY"                      always;
    add_header X-XSS-Protection          "1; mode=block"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # HSTS: el sitio se sirve solo por HTTPS detrás de Cloudflare.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Timeouts amplios hacia el backend. En este VM las primeras requests tras
    # inactividad pueden tardar varios segundos (cold start / swap-in); con el
    # default de 60s, login o registro devolvían 504. La location SSE mantiene
    # su propio proxy_read_timeout 24h porque lo define explícitamente.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Links públicos compartidos: SOLO los scrapers de preview entran al backend.
    # El index.html es único para toda la SPA y lleva los OG de la landing, así que
    # sin esto el cliente que recibe el catálogo de su vendedora ve "Nodo — Sistema
    # de Gestión" y no abre el link. El humano sigue recibiendo el estático de acá.
    location ~ "^/(catalogo|importa|tienda|agenda|tracking|import-tracking|pedido|cita|mi-pedido|mi-maleta|mis-pedidos|mi-reserva)/[0-9a-fA-F-]{36}$" {
        if ($og_bot) {
            proxy_pass http://nodo_backend_og/og$uri;
        }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # La imagen del preview la pide el scraper sin user-agent de bot.
    location /og/ {
        limit_req zone=og_zone burst=40 nodelay;
        limit_req_status 429;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Login — 10 intentos/min por IP (brute-force protection)
    location = /api/auth/jwt/login {
        limit_req zone=login_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registro — 5 intentos/min por IP. Burst 1: crear una empresa es una acción
    # deliberada y única; ráfagas solo las produce el abuso.
    location = /api/auth/register-workspace {
        limit_req zone=register_zone burst=1 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tracking público — 15 req/min por IP
    location ~ ^/api/tracking/ {
        limit_req zone=tracking_zone burst=5 nodelay;
        limit_req_status 429;

        add_header Cache-Control "public, max-age=20, s-maxage=20" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tienda pública (módulo Ventas) — 20 req/min por IP
    location ~ ^/api/store/ {
        limit_req zone=store_zone burst=8 nodelay;
        limit_req_status 429;

        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agenda pública (módulo Citas) — 30 req/min por IP: explorar la
    # disponibilidad hace varias requests (días + slots por cada día)
    location ~ ^/api/booking/ {
        limit_req zone=booking_zone burst=10 nodelay;
        limit_req_status 429;

        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Planes públicos (landing) — 30 req/min por IP. Cacheado 5 min: Cloudflare
    # absorbe el cold start del backend en la página de precios.
    location = /api/public/plans {
        limit_req zone=public_zone burst=10 nodelay;
        limit_req_status 429;

        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reserva pública (Personal Shopper) — 60 req/min por IP.
    # Es el único endpoint público que ESCRIBE y toma un FOR UPDATE sobre el ítem,
    # así que se aísla del api_zone genérico (300r/m) que compartía con las lecturas.
    # Generoso a propósito: los móviles de GT salen por CGNAT (muchos compradores
    # reales comparten IP) y acá un falso positivo es una venta perdida. El burst
    # absorbe los toques rápidos del cross-sell "Se llevan juntos"; detrás siguen el
    # límite de la app, el FOR UPDATE y el chequeo de stock.
    # Comillas obligatorias: sin ellas nginx lee el cuantificador {36} del regex como
    # apertura/cierre de bloque y no arranca.
    location ~ "^/api/shopper-catalog/public/[0-9a-fA-F-]{36}/reserve/" {
        limit_req zone=shopper_reserve_zone burst=20 nodelay;
        limit_req_status 429;

        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resto de la API — 60 req/min por IP
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (SSE)
    location /api/stream {
        proxy_pass http://backend:8000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
