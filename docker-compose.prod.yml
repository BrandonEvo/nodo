services:
  db:
    restart: always

  backend:
    restart: always
    # --proxy-headers + --forwarded-allow-ips=*: uvicorn confía en el
    # X-Forwarded-Proto/For que envía nginx (la conexión interna no viene de
    # 127.0.0.1, sino de la IP del contenedor proxy). Sin esto, el backend cree
    # que el esquema es http y genera redirects a http:// que el navegador
    # bloquea por mixed-content (HTTPS->HTTP). El acceso al backend solo es
    # posible desde la red interna de Docker (puerto 8000 no publicado).
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    # Bind-mount de los backups del host: el widget de disco mide este path
    # (statvfs cruza al filesystem real del host) y aquí vive status.json y el
    # marcador .trigger del botón "backup ahora". :rw para poder crear .trigger.
    volumes:
      - /var/backups/nodo:/backups:rw
    environment:
      - BACKUP_DIR=/backups
      # Inyectada por scripts/deploy.sh (el contenedor no puede leer la versión
      # de Docker del host sin exponer el docker.sock).
      - DOCKER_VERSION=${DOCKER_VERSION:-unknown}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.25-alpine
    container_name: nodo_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - nodo_network
    depends_on:
      backend:
        condition: service_healthy